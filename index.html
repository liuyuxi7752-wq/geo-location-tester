// ==================== 全国通用坐标转换算法 ====================

// WGS84转GCJ02（标准加密算法）
function wgs2gcj(lng, lat){
    const a=6378245.0;
    const ee=0.00669342162296594323;
    const pi=3.14159265358979324;
    
    function transformLat(x, y){
        let ret=-100.0+2.0*x+3.0*y+0.2*y*y+0.1*x*y+0.2*Math.sqrt(Math.abs(x));
        ret+=(20.0*Math.sin(6.0*x*pi)+20.0*Math.sin(2.0*x*pi))*2.0/3.0;
        ret+=(20.0*Math.sin(y*pi)+40.0*Math.sin(y/3.0*pi))*2.0/3.0;
        ret+=(160.0*Math.sin(y/12.0*pi)+320*Math.sin(y*pi/30.0))*2.0/3.0;
        return ret;
    }
    
    function transformLng(x, y){
        let ret=300.0+x+2.0*y+0.1*x*x+0.1*x*y+0.1*Math.sqrt(Math.abs(x));
        ret+=(20.0*Math.sin(6.0*x*pi)+20.0*Math.sin(2.0*x*pi))*2.0/3.0;
        ret+=(20.0*Math.sin(x*pi)+40.0*Math.sin(x/3.0*pi))*2.0/3.0;
        ret+=(150.0*Math.sin(x/12.0*pi)+300.0*Math.sin(x/30.0*pi))*2.0/3.0;
        return ret;
    }
    
    function outOfChina(lng, lat){
        if(lng<72.004||lng>137.8347)return true;
        if(lat<0.8293||lat>55.8271)return true;
        return false;
    }
    
    if(outOfChina(lng, lat)){
        return [lng, lat];
    }
    
    let dLat=transformLat(lng-105.0, lat-35.0);
    let dLng=transformLng(lng-105.0, lat-35.0);
    const radLat=lat/180.0*pi;
    let magic=Math.sin(radLat);
    magic=1-ee*magic*magic;
    const sqrtMagic=Math.sqrt(magic);
    dLat=(dLat*180.0)/((a*(1-ee))/(magic*sqrtMagic)*pi);
    dLng=(dLng*180.0)/(a/sqrtMagic*Math.cos(radLat)*pi);
    const mgLat=lat+dLat;
    const mgLng=lng+dLng;
    
    return [mgLng, mgLat];
}

// GCJ02转WGS84（3次迭代反向解密，全国通用，精度<50米）
function gcj2wgs(lng, lat){
    // 初始猜测
    let wgsLng=lng;
    let wgsLat=lat;
    
    // 迭代求解
    for(let i=0;i<CORRECTION_CONFIG.conversionIterations;i++){
        const [gcjLng, gcjLat]=wgs2gcj(wgsLng, wgsLat);
        const dLng=gcjLng-lng;
        const dLat=gcjLat-lat;
        wgsLng-=dLng;
        wgsLat-=dLat;
    }
    
    return [wgsLng, wgsLat];
}

// 获取当前位置的地区偏移量
function getRegionalOffset(lng, lat){
    for(const region of CORRECTION_CONFIG.regionalOffsets){
        if(lng>=region.minLng&&lng<=region.maxLng&&
           lat>=region.minLat&&lat<=region.maxLat){
            return region.offset;
        }
    }
    return [0, 0];
}

// 根据定位精度获取修正权重
function getAccuracyWeight(accuracy){
    if(!accuracy)return 0.5;
    const thresholds=Object.keys(CORRECTION_CONFIG.accuracyWeight).map(Number).sort((a,b)=>a-b);
    for(const t of thresholds){
        if(accuracy<=t){
            return CORRECTION_CONFIG.accuracyWeight[t];
        }
    }
    return 0.0;
}

// 完整坐标修正流程（全国通用）
function correctCoordinate(rawGcjLng, rawGcjLat, accuracy){
    // 第一步：标准GCJ02转WGS84
    let [wgsLng, wgsLat]=gcj2wgs(rawGcjLng, rawGcjLat);
    
    // 第二步：叠加地区偏移增强（仅对高精度定位生效）
    const offset=getRegionalOffset(rawGcjLng, rawGcjLat);
    const weight=getAccuracyWeight(accuracy);
    wgsLng+=offset[0]*weight;
    wgsLat+=offset[1]*weight;
    
    return {
        gcjLng: rawGcjLng.toFixed(6), // 地址解析直接用原始GCJ02，最准确
        gcjLat: rawGcjLat.toFixed(6),
        wgsLng: wgsLng.toFixed(6),
        wgsLat: wgsLat.toFixed(6)
    };
}

            ok(wgsLat, wgsLng, acc, src, addr, rawLat, rawLng);

        .catch(()=>{
            ok(wgsLat, wgsLng, acc, src,'地址解析失败', rawLat, rawLng);
        });
}

// 三重IP定位链式调用：高德→百度→第三方
function ipLocChain(){
    document.getElementById('tx').innerText='正在通过IP地址校准位置...';
    
    // 第一重：高德IP定位
    fetch('https://restapi.amap.com/v3/ip?key='+_webAK)
        .then(r=>r.json())
        .then(data=>{
            if(data.status==='1'&&data.rectangle&&data.rectangle!==''){
                const pts=data.rectangle.split(';');
                const p1=pts[0].split(',');
                const p2=pts[1].split(',');
                const lt=((parseFloat(p1[1])+parseFloat(p2[1]))/2).toFixed(6);
                const ln=((parseFloat(p1[0])+parseFloat(p2[0]))/2).toFixed(6);
                ok(lt,ln,'IP定位(城市级)','高德IP定位',data.city||'未知城市');
            }else{
                throw new Error('高德IP定位失败');
            }
        })
        .catch(()=>{
            // 第二重：百度IP定位
            fetch('https://api.map.baidu.com/location/ip?ak=E4805d16520de693a3fe707cdc962045&coor=bd09ll')
                .then(r=>r.json())
                .then(data=>{
                    if(data.status===0&&data.content&&data.content.point){
                        // 百度坐标转高德坐标（BD09→GCJ02）
                        const bd_lng=data.content.point.x;
                        const bd_lat=data.content.point.y;
                        const x_pi=3.14159265358979324*3000.0/180.0;
                        const x=bd_lng-0.0065;
                        const y=bd_lat-0.006;
                        const z=Math.sqrt(x*x+y*y)-0.00002*Math.sin(y*x_pi);
                        const theta=Math.atan2(y,x)-0.000003*Math.cos(x*x_pi);
                        const gcj_lng=z*Math.cos(theta);
                        const gcj_lat=z*Math.sin(theta);
                        ok(gcj_lat.toFixed(6),gcj_lng.toFixed(6),'IP定位(城市级)','百度IP定位',data.content.address||'未知城市');
                    }else{
                        throw new Error('百度IP定位失败');
                    }
                })
                .catch(()=>{
                    // 第三重：第三方IP定位
                    fetch('https://ipapi.co/json/')
                        .then(r=>r.json())
                        .then(data=>{
                            if(data.latitude&&data.longitude){

                        });
                });
        });

    else if(lk>=50){pool=_hD.m;txt=_hD.mT}
    else{pool=_hD.b;txt=_hD.bT}
    ix=Math.abs(((parseFloat(lt)*100+parseFloat(ln)*10)|0)+lk)%pool.length;
    const dr=pool[ix];
    const dg=_r[_d.indexOf(dr)];
    const ds=txt[ix];
    document.getElementById('nd').style.transform='rotate('+dg+'deg)';
    document.getElementById('rd').innerText='您的最佳能量方位：'+dr;
    document.getElementById('de').innerText=ds+'（近日幸运指数：'+lk+'分）';
}
</script>
